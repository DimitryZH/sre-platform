apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stage
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 65.5.1
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/observability/helm/kube-prometheus-stack/values.yaml
          - $values/environments/stage/values/kube-prometheus-stack-shared.yaml
          - $values/environments/stage/values/kube-prometheus-stack.yaml
    - repoURL: https://github.com/DimitryZH/sre-platform
      targetRevision: main
      ref: values
