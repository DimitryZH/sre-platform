apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: online-shop-stage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/part-of: online-shop
    env: stage
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: online-shop-stage
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .status.terminatingReplicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  sources:
    - repoURL: https://github.com/DimitryZH/sre-platform
      targetRevision: main
      path: charts/platform
      helm:
        releaseName: online-shop-stage
        valueFiles:
          - $values/environments/stage/values/platform.yaml
    - repoURL: https://github.com/DimitryZH/sre-platform
      targetRevision: main
      ref: values
