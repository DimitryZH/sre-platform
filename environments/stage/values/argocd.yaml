# Reviewed staging input for argo/argo-cd 7.8.28. This file is not a live release.
createAggregateRoles: false
createClusterRoles: true

dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  # Chart 7.8.28 has no enabled switch; zero replicas disables the controller.
  replicas: 0

# No Argo CD extension configuration or extension containers are enabled for staging.

redis-ha:
  enabled: false

# Kubernetes can report this Deployment status field before the pinned Argo CD
# version's diff schema recognizes it. It is status-only and never desired state.
configs:
  cm:
    resource.customizations.ignoreDifferences.apps_Deployment: |
      jqPathExpressions:
        - .status.terminatingReplicas

controller:
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

repoServer:
  # Manifest generation exceeded the previous 128Mi limit. Keep the reviewed
  # CPU request while reserving a bounded, single-Pod memory envelope.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 384Mi

server:
  ingress:
    enabled: false
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 75m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi

redisSecretInit:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
