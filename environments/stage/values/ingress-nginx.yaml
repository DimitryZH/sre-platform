# Reviewed staging input for ingress-nginx/ingress-nginx 4.12.1. This file is not a live release.
controller:
  replicaCount: 1
  watchIngressWithoutClass: false
  ingressClassResource:
    enabled: true
    default: false
  scope:
    enabled: true
    namespace: online-shop-stage
  resources:
    requests:
      cpu: 75m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  extraArgs:
    # Stage Ingresses are hostless; expose their request series for the SLI rules.
    metrics-per-undefined-host: "true"
  service:
    enabled: true
    type: ClusterIP
    external:
      # "external" is the chart's primary controller Service, not public exposure.
      # Keep it enabled as ClusterIP for in-cluster staging traffic only.
      enabled: true
  metrics:
    enabled: true
    service:
      enabled: true
    serviceMonitor:
      # Created separately by GitOps after the Prometheus Operator CRDs are healthy.
      enabled: false
  admissionWebhooks:
    enabled: false

defaultBackend:
  enabled: false
