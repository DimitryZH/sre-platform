prometheus:
  prometheusSpec:
    # Keep selectors aligned with observability/helm/kube-prometheus-stack/values.yaml
    serviceMonitorSelector:
      matchLabels:
        release: monitoring
    serviceMonitorNamespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - ingress-nginx
            - online-shop-dev
            - online-shop-stage

    ruleSelector:
      matchLabels:
        release: monitoring
    ruleNamespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - monitoring
            - online-shop-dev
            - online-shop-stage

# Avoid ArgoCD deadlocks on kube-prometheus admission hook Jobs/RBAC in bootstrap.
prometheusOperator:
  admissionWebhooks:
    # This constrained baseline does not need admission validation. Disabling
    # the webhook avoids a TLS Secret dependency when patch hooks are off.
    enabled: false
    patch:
      enabled: false
