# STAGE environment overlay (converged with validated dev baseline).
global:
  namespace: online-shop-stage

# The resource policy is the reviewed Issue #7 minimum staging footprint.
break:
  enabled: false

loadgenerator:
  deployment:
    enabled: false
  monitoring:
    serviceMonitor:
      enabled: false

frontend:
  replicaCount: 1
  ingress:
    # Keep catch-all ingress for direct LoadBalancer IP validation.
    useHost: false
    # Stage runs hostless on a shared ingress; use a unique path to avoid host "_" collisions with dev.
    pathPrefix: /stage
  rollouts:
    enabled: true
  image:
    tag: v0.10.4
  resources:
    requests:
      cpu: 75m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

cart:
  replicaCount: 1
  image:
    tag: v0.10.4
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 150m, memory: 256Mi }

checkout:
  replicaCount: 1
  image:
    tag: v0.10.4
  resources:
    requests: { cpu: 75m, memory: 128Mi }
    limits: { cpu: 250m, memory: 256Mi }

payment:
  replicaCount: 1
  image:
    tag: v0.10.4
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 150m, memory: 192Mi }

adservice:
  replicaCount: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 150m, memory: 256Mi }

currencyservice:
  replicaCount: 1
